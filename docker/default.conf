server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Bill Tracker";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Backs the Downloads tab — mounted as a volume (see docker-compose.yml)
    # rather than baked into the image, so dropping a new installer in the
    # folder on the host shows up immediately with no rebuild. JSON format
    # lets the app read exactly what's there instead of a hardcoded list.
    # Still behind the auth_basic above (inherited from the server block).
    location /downloads/ {
        autoindex on;
        autoindex_format json;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Filled in (or removed) at container start by 40-configure-auth.sh,
    # based on AUTH_MODE — see that script for what each mode does.
    #AUTH_BASIC#

    # Backs the Downloads tab — mounted as a volume (see docker-compose.yml)
    # rather than baked into the image, so dropping a new installer in the
    # folder on the host shows up immediately with no rebuild. JSON format
    # lets the app read exactly what's there instead of a hardcoded list.
    # Still behind auth_basic above when AUTH_MODE=basic (inherited from the
    # server block) — wide open if it's been turned off (AUTH_MODE=none).
    location /downloads/ {
        autoindex on;
        autoindex_format json;
    }

    location / {
        try_files $uri /index.html;
    }
}
